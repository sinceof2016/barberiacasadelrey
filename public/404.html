<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>Barbería La Casa del Rey</title>
    <script>
      // Single Page Application redirect for GitHub Pages
      const segmentCount = 1;
      const location = window.location;
      location.replace(
        location.protocol + '//' + location.hostname + (location.port ? ':' + location.port : '') +
        location.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
        location.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (location.search ? '&q=' + location.search.slice(1).replace(/&/g, '~and~') : '') +
        location.hash
      );
    </script>
  </head>
  <body style="background-color: #14100E; color: #FAF6EE; font-family: sans-serif; text-align: center; padding-top: 50px;">
    <p>Cargando Barbería La Casa del Rey...</p>
  </body>
</html>
